name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows, because that is the only thing we ship. Running the matrix on three
    # runners would be paying for coverage of platforms nobody can download.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Build BEFORE test, so the build-output assertions in src/main/build.test.ts have
      # something to inspect. They skip themselves when out/ is absent, which would make
      # a green run meaningless if this ran the other way round.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Actually start the app. Every other check here was green while it was completely
      # dead — the preload filename did not match what the build emitted, so the renderer
      # had no bridge and the window just sat there. Nothing that stops short of
      # launching it can catch that.
      - name: Smoke (launch the app)
        run: npm run smoke

      # Packaging is where this project actually breaks — a build that compiles but
      # produces an installer nobody can run is the failure mode worth catching on
      # every PR, not on tag day.
      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: installer
          path: dist/*.exe
          retention-days: 7
