<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Raidify Companion</title>
    <!--
      No remote origins. The renderer is local files talking to the main process over
      IPC; if a stylesheet or a script ever needs a CDN, that is a design mistake.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
