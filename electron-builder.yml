appId: app.raidify.companion
productName: Raidify Companion
copyright: Copyright © 2026 FriskyyDev

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - package.json

asar: true

# Windows and Linux. macOS is still dropped rather than deferred: Gatekeeper refuses
# unsigned bundles outright, so it is $99/yr or nothing.
#
# Linux was dropped alongside macOS on the grounds that every distributed platform is a
# support surface and Wine prefix discovery is the fiddliest of the three. Reinstated
# 2026-08-20 at the owner's request, and the ground has moved under the original reason:
# the security-critical path was already written for Linux (secrets.ts detects a missing
# keyring and refuses to persist a token in plaintext), and `findSavedVariables` takes any
# path, so pointing at a Wine prefix by hand has always worked. Auto-detect now knows the
# usual Proton, Lutris and Bottles locations too.
#
# AppImage only, on purpose. One artifact that runs on every distribution without a
# package manager is one support surface; .deb and .rpm would be three.
win:
  target:
    - target: nsis
      arch:
        # 32-bit, matching the WCL Uploader. Costs nothing and removes an entire class
        # of "it won't run" reports.
        - ia32
  artifactName: raidify-companion-v${version}.${ext}

  # UNSIGNED BY DECISION, not by oversight.
  #
  # $9.99/mo Azure Artifact Signing against a free feature with no revenue behind it is
  # ~40 boosts a year for a wall the audience already clicks through — these users
  # install addons by unzipping folders. What signing actually buys is antivirus
  # standing, and that is worth revisiting the first time a false positive lands.
  #
  # To turn it on later: set the AZURE_* secrets in CI and add a `signtoolOptions`
  # block here. Nothing else in this file has to change.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true

linux:
  # Linux cannot use the Windows .ico — electron-builder's icon tool accepts only .png,
  # .svg and .icns, and the first Linux release failed on exactly that. The .ico's largest
  # frame is 256, so this is the same mark taken from the 512 the web app already ships
  # rather than an upscale of it.
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: raidify-companion-v${version}-${arch}.${ext}
  category: Game
  synopsis: Uploads your WoW raid night to Raidify
  description: >-
    Watches the file the Raidify addon writes when you log out and sends that night to
    your guild, so nobody has to remember to paste an export string.

# The update feed lives on GitHub releases — free CDN, no bucket, no manifest hosting.
# The WCL Uploader's repo does exactly this and holds no source at all.
#
# Windows reads latest.yml and Linux reads latest-linux.yml, so the two platforms publish
# side by side into one release without colliding.
publish:
  provider: github
  owner: FriskyyDev
  repo: Raidify-Companion
